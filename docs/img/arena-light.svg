<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 712" width="1200" height="712" role="img" aria-labelledby="arena-title arena-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="arena-title">Evaluate: the Arena, where a new agent practises before any real person</title>
  <desc id="arena-desc">A new agent never learns on real people first. The Arena is self play between two models: one side is the agent, the other side is a practice person made from behaviour. The practice person shown is a made-up example. Worry: the price. Patience: low, two dodged answers then quiet. Language: Arabic, Franco and English mixed. Opens with: a voice note. Buys when: delivery time is clear. Cleaned example line: how much with delivery? They play a match of short chat turns. The verdict is judged in code: the match is won only when the order tool really placed the order on the person's yes, and an order confirmed message with no order fails the fact check. To go live the agent needs 7 of 10 matches won, a pass mark set per sector. The hard ones come back to the practice person side for more practice. Practice on real behaviour before any real person.</desc>
