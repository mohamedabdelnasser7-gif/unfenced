<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 778" width="1200" height="778" role="img" aria-labelledby="lesson-c-title lesson-c-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="lesson-c-title">One case, two learning speeds: a hotfix in seconds and a tested lesson by night</title>
  <desc id="lesson-c-desc">A lesson is a short record that carries where it came from, and every row is tied to one case, case 4821 (made-up example). Lesson: show the value first. The lost case went quiet after the price. In seconds a hotfix says try this instead, for that person's next case only. Night Reflection then finds across many cases, price without value lost more. The lesson passed the eval gate (example counts: 3 fixed, 0 broken), runs as a canary on a small share of chats first, and the next case goes better. Checks stop today's mistake. Reflection stops it coming back.</desc>
